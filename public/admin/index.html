<!DOCTYPE html>
<html lang="zh-CN"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>图标图片管理</title><link rel="stylesheet" href="/style.css"><link rel="stylesheet" href="/admin/admin.css"></head>
<body><header><h1><span class="brand-icon" aria-hidden="true">◒</span>图标图片管理</h1><a href="/" target="_blank" rel="noopener">查看游戏 ↗</a></header>
<main><section id="login-panel" class="login-panel"><span class="eyebrow">管理空间</span><h2 id="login-title">为下一颗图标，换个模样。</h2><p>使用具有管理员权限的账号登录。</p><form id="login-form"><label id="email-label">邮箱<input id="email" type="email" autocomplete="username" required></label><label>密码<input id="password" type="password" autocomplete="current-password" required></label><button class="primary" id="submit">登录</button><button type="button" id="forgot">忘记密码</button></form><p class="setup">首次使用：请在项目后台的 Identity 中邀请自己的邮箱，并为账号添加 admin 角色。通过邀请邮件设置密码后即可登录。</p></section>
<section id="manager" hidden><div class="manager-heading"><div><span class="eyebrow">11 级图标 · 自定义图片</span><h2>把喜欢的图片，放进游戏。</h2><p>选择图标并上传，即可替换。支持 PNG、JPG、WebP，单张不超过 4 MB，推荐透明背景的正方形图片。</p></div><button id="logout">退出登录</button></div><div id="grid" class="fruit-grid"></div><p class="footnote">上传后刷新游戏查看效果；已打开的游戏不会中途切换图片。</p></section>
<p id="message" role="status" aria-live="polite"></p></main><script src="/admin/admin.js" defer></script></body></html>
